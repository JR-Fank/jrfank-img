# 從 R2 私有 bucket 下載原圖 → webimg.py 出圖 → 提交、推送 → EdgeOne Pages 自動部署 pic.jrfank.cc
# 觸發：Actions 頁面手動（workflow_dispatch），或後台 / API 送 repository_dispatch：
#   gh api repos/JR-Fank/jrfank-img/dispatches -f event_type=build-photos -F 'client_payload[photos][]=hk/hk-1.jpeg'
# 參數是 R2 上的原圖鍵（<系列>/<照片 id>.<副檔名>；評測文章圖 reviews/<文章 slug>/<照片 id>.<副檔名>），空白或換行分隔；
# 副檔名可以是影片（mov、mp4、m4v）：同一個 id 有圖片和影片 = Live Photo，只有影片 = 影片（見 README「影片與 Live Photo」）；
# all = bucket 裡全部；以 / 結尾的是資料夾（例如 reviews/ = 全部文章圖、reviews/orico-test-mac/ = 一篇）
name: build photos
# 後台觸發時帶批次 id（client_payload.batch），寫進 run 的標題，後台用它把觸發和 run 一對一配起來
run-name: ${{ github.event.client_payload.batch && format('build photos · {0}', github.event.client_payload.batch) || 'build photos' }}

on:
  workflow_dispatch:
    inputs:
      photos:
        description: "R2 上的原圖（<系列>/<照片 id>.<副檔名> 或 reviews/<文章>/<照片 id>.<副檔名>，空白分隔；資料夾以 / 結尾，例如 reviews/）；all = 全部"
        required: true
        default: all
      force:
        description: "原圖和出圖配方都沒變也重做"
        type: boolean
        default: false
  repository_dispatch:
    types: [build-photos]

# 一次只跑一個；排隊的事件 SHA 仍可能過期，所以 checkout 明確取最新 main。
concurrency:
  group: build-photos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    # macOS：和本機同一套 ImageMagick（brew）與系統 sRGB 描述檔，出圖結果一致
    runs-on: macos-15
    timeout-minutes: 90
    env:
      BUCKET: jrfank-originals
      R2_ENDPOINT: https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      # aws-cli 2.23+ 預設送的檢查碼 R2 不全支援
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      PHOTOS: ${{ github.event.inputs.photos || join(github.event.client_payload.photos, ' ') }}
      FORCE: ${{ github.event.inputs.force == 'true' || github.event.client_payload.force == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 記錄建置起點
        run: echo "PHOTO_BUILD_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: 原圖暫存目錄
        run: |
          echo "JRFANK_ORIGINALS=$RUNNER_TEMP/originals" >> "$GITHUB_ENV"
          # 出片失敗（太長、太大的影片）的照片鍵；publish 和部署確認跳過這些，其他照片照常提交
          echo "JRFANK_BUILD_FAILURES=$RUNNER_TEMP/build-failures.txt" >> "$GITHUB_ENV"
          # 同一批失敗的鍵＋原因代碼（JSON）：存成 photo-build-failures artifact，後台讀它在那一張上顯示中文原因
          echo "JRFANK_BUILD_FAILURES_JSON=$RUNNER_TEMP/build-failures/build-failures.json" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/build-failures"

      - name: 安裝 ImageMagick
        run: |
          brew install imagemagick
          magick -version | head -1
          magick -list format | grep -E "^ +(WEBP|HEIC|JPEG|TIFF)" || true

      - name: 下載原圖
        run: |
          set -euo pipefail
          mkdir -p "$JRFANK_ORIGINALS"
          if [ -z "$PHOTOS" ]; then echo "沒有指定照片"; exit 1; fi
          if [ "$PHOTOS" = all ]; then
            aws s3 cp "s3://$BUCKET/" "$JRFANK_ORIGINALS/" --recursive --exclude "*" --include "*/*" --endpoint-url "$R2_ENDPOINT" --only-show-errors
            echo "BUILD_ALL=1" >> "$GITHUB_ENV"
          else
            for k in $PHOTOS; do
              # 資料夾：reviews/、reviews/<文章>/，或一個系列 <系列>/
              if [[ "$k" =~ ^reviews/([a-z0-9-]+/)?$ || ( "$k" =~ ^[a-z0-9-]+/$ && "$k" != reviews/ ) ]]; then
                # 資料夾：整個抓下來，出圖時不指定照片（= 抓下來的全部）
                aws s3 cp "s3://$BUCKET/$k" "$JRFANK_ORIGINALS/$k" --recursive --endpoint-url "$R2_ENDPOINT" --only-show-errors
                echo "BUILD_ALL=1" >> "$GITHUB_ENV"
                continue
              fi
              # 文章圖只能三段 reviews/<文章>/<id>；一般系列兩段 <系列>/<id>，系列不能叫 reviews
              # 副檔名不分大小寫（和 webimg.py 的 suffix.lower() 一樣）：.jpg .JpG .webp .HEIF 都收
              ext="$(printf '%s' "${k##*.}" | tr '[:upper:]' '[:lower:]')"
              case "$ext" in jpg|jpeg|png|tif|tiff|heic|heif|webp|mov|mp4|m4v) ;; *) echo "原圖副檔名不支援：$k"; exit 1 ;; esac
              if [[ "$k" == reviews/* ]]; then re='^reviews/[a-z0-9-]+/[a-z0-9-]+\.[A-Za-z]+$'; else re='^[a-z0-9-]+/[a-z0-9-]+\.[A-Za-z]+$'; fi
              if ! [[ "$k" =~ $re ]]; then
                echo "原圖鍵格式不對：$k"; exit 1
              fi
              aws s3 cp "s3://$BUCKET/$k" "$JRFANK_ORIGINALS/$k" --endpoint-url "$R2_ENDPOINT" --only-show-errors
              # 同一個 id 的其他原檔（Live Photo 的圖片／影片）一起抓：只換靜態圖時影片也要在，live 欄位才不會掉
              # 前綴 <id>. 不會配到 <id>0（例如 hk-1. 不配 hk-10.jpeg）；ls 列出的是同一層的檔名
              aws s3 ls "s3://$BUCKET/${k%.*}." --endpoint-url "$R2_ENDPOINT" | awk '{print $4}' | while read -r name; do
                other="${k%/*}/$name"
                ext="$(printf '%s' "${name##*.}" | tr '[:upper:]' '[:lower:]')"
                case "$ext" in jpg|jpeg|png|tif|tiff|heic|heif|webp|mov|mp4|m4v) ;; *) continue ;; esac
                if [ "$other" != "$k" ] && [ ! -f "$JRFANK_ORIGINALS/$other" ]; then
                  echo "同 id 一起下載：$other"
                  aws s3 cp "s3://$BUCKET/$other" "$JRFANK_ORIGINALS/$other" --endpoint-url "$R2_ENDPOINT" --only-show-errors
                fi
              done
            done
          fi
          find "$JRFANK_ORIGINALS" -type f | wc -l

      - name: 安裝 ffmpeg（有影片才裝）
        run: |
          # ffmpeg-full：keg-only，有 HDR 轉 SDR 要用的 zscale（核心的 ffmpeg 沒有 zimg）；webvid.py 會優先找它
          if find "$JRFANK_ORIGINALS" -type f \( -iname '*.mov' -o -iname '*.mp4' -o -iname '*.m4v' \) | grep -q .; then
            brew install ffmpeg-full
            "$(brew --prefix ffmpeg-full)/bin/ffmpeg" -hide_banner -filters | grep -E " (zscale|tonemap) "
          else
            echo "沒有影片原檔，不裝 ffmpeg"
          fi

      - name: 出圖
        run: |
          set -euo pipefail
          keys=()
          if [ -z "${BUILD_ALL:-}" ]; then for k in $PHOTOS; do keys+=("${k%.*}"); done; fi
          flags=()
          if [ "$FORCE" = true ]; then flags+=(--force); fi
          # ${a[@]+"${a[@]}"}：空陣列在 bash 3.2 + set -u 也不報錯
          # 退出碼 3 = 有照片出片失敗（其他已照常處理）：照常提交其他照片，最後一步再讓 run 失敗
          status=0
          python3 tools/webimg.py build ${keys[@]+"${keys[@]}"} ${flags[@]+"${flags[@]}"} || status=$?
          if [ "$status" = 3 ]; then echo "BUILD_PARTIAL=1" >> "$GITHUB_ENV"; elif [ "$status" != 0 ]; then exit "$status"; fi
          python3 tools/webimg.py check

      # 有照片出片失敗：先存失敗報告（後面的提交或部署確認失敗也拿得到），再寫進 job summary 給人看
      - name: 保存出片失敗報告
        if: env.BUILD_PARTIAL == '1'
        uses: actions/upload-artifact@v4
        with:
          name: photo-build-failures
          path: ${{ runner.temp }}/build-failures/build-failures.json
          retention-days: 30
          if-no-files-found: error

      - name: 出片失敗摘要
        if: env.BUILD_PARTIAL == '1'
        run: |
          python3 - "$JRFANK_BUILD_FAILURES_JSON" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          print("### 出片失敗的照片（其他照片照常提交）\n")
          print("| 照片 | 種類 | 原因代碼 | 訊息 |")
          print("| --- | --- | --- | --- |")
          for f in report["failures"]:
              msg = f["message"].replace("|", "\\|").replace("\n", " ")[:300]
              print(f"| `{f['key']}` | {f['kind']} | {f['code']} | {msg} |")
          PY

      - name: 提交、推送
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 tools/publish-photos.py

      - name: 確認圖片站部署
        timeout-minutes: 15
        run: python3 tools/verify_photo_deployment.py --base "$PHOTO_BUILD_BASE" --output "$RUNNER_TEMP/deployment-proof.json"

      - name: 保存部署確認
        uses: actions/upload-artifact@v4
        with:
          name: photo-deployment-proof
          path: ${{ runner.temp }}/deployment-proof.json
          retention-days: 90
          if-no-files-found: error

      - name: 回報出片失敗的照片
        if: env.BUILD_PARTIAL == '1'
        run: |
          echo "以下照片出片失敗，沒有提交（原因見「出圖」步驟）："
          cat "$JRFANK_BUILD_FAILURES"
          exit 1
